name: rag_kit
description: >-
  Pure-Dart RAG (retrieval-augmented generation): chunking, embeddings, vector
  search, and context building. Zero dependencies, bring your own embedding
  model.
version: 1.0.3
repository: https://github.com/Yusufihsangorgel/rag_kit
topics:
  - rag
  - retrieval
  - embeddings
  - llm
  - nlp

screenshots:
  - description: >-
      Same query and topK through retrieve and retrieveDiverse: three
      near-identical paragraphs on the left at 0.90 closest pair, three distinct
      ones on the right at 0.31.
    path: doc/diverse-retrieval.png
  - description: >-
      One Retriever ties a chunker, your embedder and a vector store together,
      shared by the indexing path and the query path.
    path: doc/architecture.png

environment:
  sdk: ^3.8.0

dev_dependencies:
  # example/with_vector_kit.dart only. Pure Dart, no runtime dependencies,
  # so it costs consumers nothing.
  vector_kit: ^1.1.0
  lints: ^6.0.0
  test: ^1.25.0

<rect width="100%" height="100%" fill="#ffffff"/>
<text x="40" y="36" font-size="17" font-weight="600" fill="#111827"
  >Three chunks of context, and similarity alone spends all three on one
   sentence</text>
<text x="40" y="60" font-size="13" fill="#6b7280"

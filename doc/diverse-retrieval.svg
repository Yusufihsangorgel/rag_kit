<text x="58" y="378.0" font-size="13" fill="#b91c1c" font-weight="600"
  >Left: the model is told the same thing three times, and the
   notice window it needs never arrives.</text>
<text x="58" y="400.0" font-size="13" fill="#047857" font-weight="600"
  >Right: one of the three is kept, and the notice window and the carry-over rule take the seats
   the copies were using.</text>
